[project]
name = "law-study-workbench"
version = "0.8.0"
description = "Local-first, evidence-driven law exam study workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
